<div class="tabs-bar">

  <button
    class="home"
    (click)="goHome()"
    title="Library"
    [class.active]="(isHomeActive$ | async) || ((activeId$ | async) === null)"
  >
    🏠
  </button>

  <div
    class="tabs-scroll"
    cdkDropList
    cdkDropListOrientation="horizontal"
    (cdkDropListDropped)="onDrop($event)"
  >

    @for (tab of tabs$ | async; track tab.id) {
      <div
        class="tab"
        cdkDrag
        [cdkDragData]="tab"
        [class.active]="(activeId$ | async) === tab.id"
        (click)="onActivate(tab.id)"
        [title]="tab.title"
      >
        <img
          class="format-icon"
          [class.djvu-icon]="!tab.book.filename.toLowerCase().endsWith('.pdf')"
          [src]="tab.book.filename.toLowerCase().endsWith('.pdf')
            ? 'assets/images/pdf.svg'
            : 'assets/images/djvu.svg'"
                  alt=""
        />

        <span class="title">{{ tab.title }}</span>

        <button
          class="close"
          (click)="onClose(tab.id, $event)"
        >
          ×
        </button>
      </div>
    }

  </div>
</div>
